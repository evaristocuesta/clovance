name: Publish Docker Images to GHCR

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write

    strategy:
      matrix:
        include:
          - name: api
            dockerfile: ./api/src/Clovance.ApiService/Dockerfile
            context: .
            image_name: clovance-api
          - name: frontend
            dockerfile: ./frontend/Dockerfile
            context: ./frontend
            image_name: clovance-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image_name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      # Runs after push because buildx publishes a multi-arch image that cannot be
      # loaded into the local daemon. A red run still means "do not promote this tag".
      - name: Scan image with Trivy
        env:
          TRIVY_CACHE: ${{ runner.temp }}/trivy-cache
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image_name }}@${{ steps.build.outputs.digest }}"
          TRIVY="docker run --rm -v ${TRIVY_CACHE}:/root/.cache -v $HOME/.docker/config.json:/root/.docker/config.json:ro aquasec/trivy:latest image --scanners vuln --ignore-unfixed"
          echo "::group::Vulnerability report (fixable HIGH/CRITICAL)"
          ${TRIVY} --severity HIGH,CRITICAL "${IMAGE}"
          echo "::endgroup::"
          echo "::group::Release gate (fixable CRITICAL)"
          ${TRIVY} --severity CRITICAL --exit-code 1 "${IMAGE}"
          echo "::endgroup::"

      # Trivy cannot see the eMudhra incident (CVE-2026-111943): the fix is a CA
      # bundle change with no Alpine/Ubuntu package CVE, so it needs its own check.
      - name: Verify CA bundle distrusts compromised eMudhra roots
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image_name }}@${{ steps.build.outputs.digest }}"
          docker pull -q "${IMAGE}"
          if docker create --name ca-check "${IMAGE}" >/dev/null \
            && docker cp ca-check:/etc/ssl/certs/ca-certificates.crt ./ca-bundle.crt 2>/dev/null; then
            docker rm -f ca-check >/dev/null
            docker run --rm -v "${PWD}:/w" alpine:3 sh /w/scripts/check-ca-bundle.sh /w/ca-bundle.crt
          else
            docker rm -f ca-check >/dev/null 2>&1 || true
            echo "::error::Could not extract the CA bundle; cannot verify compromised eMudhra roots"
            exit 1
          fi
          rm -f ./ca-bundle.crt

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image_name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

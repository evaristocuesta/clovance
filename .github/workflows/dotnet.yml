name: Build and Test API

on:
  push:
    branches: [ "main" ]
    paths:
      - "api/**"
      - ".github/workflows/dotnet.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "api/**"
      - ".github/workflows/dotnet.yml"
  workflow_dispatch:

# Least privilege for the default token: this workflow only needs to read the code it
# builds and tests.
permissions:
  contents: read

jobs:
  build-api:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore
      working-directory: ./api/src/Clovance.ApiService
      
    - name: Build
      run: dotnet build --no-restore --configuration Release
      working-directory: ./api/src/Clovance.ApiService

    - name: Restore unit tests dependencies
      run: dotnet restore
      working-directory: ./api/tests/Clovance.UnitTests

    - name: Build unit tests
      run: dotnet build --no-restore --configuration Release
      working-directory: ./api/tests/Clovance.UnitTests      
    
    - name: Run unit tests
      run: dotnet test --no-build --verbosity normal --configuration Release
      working-directory: ./api/tests/Clovance.UnitTests

    - name: Restore integration tests dependencies
      run: dotnet restore
      working-directory: ./api/tests/Clovance.IntegrationTests

    - name: Build integration tests
      run: dotnet build --no-restore --configuration Release
      working-directory: ./api/tests/Clovance.IntegrationTests

    - name: Run integration tests
      run: dotnet test --no-build --verbosity normal --configuration Release
      working-directory: ./api/tests/Clovance.IntegrationTests      
